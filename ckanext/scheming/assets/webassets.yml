scheming_css:
  filter: cssrewrite
  output: ckanext-scheming/%(version)s_scheming_css.css
  contents:
    - styles/scheming.css

subfields:
  filters: rjsmin
  output: ckanext-scheming/%(version)s_scheming_subfields.js
  extra:
    preload:
      - base/main
  contents:
    - js/scheming-repeating-subfields.js

multiple_text:
  filters: rjsmin
  output: ckanext-scheming/%(version)s_scheming_multiple_text.js
  extra:
    preload:
      - base/main
  contents:
    - js/scheming-multiple-text.js

suggestions:
  filters: rjsmin
  output: ckanext-scheming/%(version)s_scheming_suggestions.js
  extra:
    preload:
      - base/main
  contents:
    - js/scheming-suggestions.js

ai-suggestions:
  filter: rjsmin
  output: ckanext-scheming/%(version)s_scheming-ai-suggestions.js
  contents:
    - js/scheming-ai-suggestions.js
  extra:
    preload:
      - base/main